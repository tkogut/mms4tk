version: '3.8'

services:
  antigravity_core:
    build: .
    container_name: antigravity_core
    restart: unless-stopped
    networks:
      - internal_swarm_net
      - traefik-proxy
    volumes:
      - ./.agents/swarm:/app/.agents/swarm
    env_file:
      - .env

networks:
  internal_swarm_net:
    driver: bridge
  traefik-proxy:
    external: true


