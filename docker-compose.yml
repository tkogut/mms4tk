services:
  antigravity_core:
    build: .
    container_name: antigravity_core
    restart: unless-stopped
    networks:
      - internal_swarm_net
      - traefik-proxy
    volumes:
      - ./.agents/swarm:/app/.agents/swarm
    env_file:
      - .env

  ui_dashboard:
    build: ./ui_dashboard
    container_name: ui_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    networks:
      - internal_swarm_net
      - traefik-proxy
    volumes:
      - ./.env:/app/.env
      - ./.agents/swarm:/app/.agents/swarm:ro
    env_file:
      - .env

networks:
  internal_swarm_net:
    driver: bridge
  traefik-proxy:
    external: true


