services:
  antigravity_core:
    build: .
    container_name: antigravity_core
    user: "0:0"
    restart: unless-stopped
    networks:
      - internal_swarm_net
      - traefik-proxy
    volumes:
      - ./.agents/swarm:/app/.agents/swarm
      - ./VERSION:/app/VERSION:ro
      - /docker/hermes-agent/data:/app/hermes_data
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ui_dashboard:
    build: ./ui_dashboard
    container_name: ui_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    networks:
      - internal_swarm_net
      - traefik-proxy
    volumes:
      - ./.env:/app/.env
      - ./.agents/swarm:/app/.agents/swarm:ro
      - ./VERSION:/app/VERSION:ro
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mastermind_ui.entrypoints=websecure"
      - "traefik.http.routers.mastermind_ui.rule=Host(`mastermind.srv1490214.hstgr.cloud`)"
      - "traefik.http.routers.mastermind_ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mastermind_ui.tls=true"
      - "traefik.http.routers.mastermind_ui.middlewares=mastermind-auth"
      - "traefik.http.middlewares.mastermind-auth.basicauth.users=${MMS4_UI_BASIC_AUTH:-admin:{SHA}wVzGfjblQLdYsJ5xfQcACBwdZ4c=}"
      - "traefik.http.services.mastermind_ui.loadbalancer.server.port=8501"

networks:
  internal_swarm_net:
    driver: bridge
  traefik-proxy:
    external: true


